---
name: 'deploy-dev'

on:
  push:
    branches:
      - dev
  # Lets dependabot-auto-merge.yml / dependabot-cc-codex.yml deploy after merging:
  # merges made with GITHUB_TOKEN don't fire the push trigger above.
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: 'ssh://dokku@dokku-pmf-sandbox.westus2.cloudapp.azure.com:22/bill-tracker-dev'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_SANDBOX_DOKKU }}
          branch: dev
          git_push_flags: '--force'
